<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Run Rocky Run</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#241812;
  touch-action:manipulation;
  font-family:Arial,sans-serif;
}

#game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;

  background:
    linear-gradient(
      to bottom,
      #e7bd86 0%,
      #dca86f 55%,
      #c58a55 100%
    );
}


/* =====================================================
   MOVING BACKGROUND
===================================================== */

.mountainLayer{
  position:absolute;

  left:0;
  bottom:30%;

  width:300%;
  height:38%;

  background:
    linear-gradient(
      135deg,
      transparent 35%,
      #a66d43 36%,
      #a66d43 48%,
      transparent 49%
    );

  background-size:280px 190px;

  opacity:.42;

  animation:
    mountainMove
    14s linear infinite;

  z-index:1;
}

.mountainLayer2{
  position:absolute;

  left:0;
  bottom:30%;

  width:300%;
  height:25%;

  background:
    linear-gradient(
      135deg,
      transparent 35%,
      #8f5a38 36%,
      #8f5a38 50%,
      transparent 51%
    );

  background-size:220px 140px;

  opacity:.35;

  animation:
    mountainMove2
    9s linear infinite;

  z-index:2;
}

@keyframes mountainMove{

  from{
    transform:translateX(0);
  }

  to{
    transform:translateX(-560px);
  }

}

@keyframes mountainMove2{

  from{
    transform:translateX(0);
  }

  to{
    transform:translateX(-440px);
  }

}


/* =====================================================
   SUN
===================================================== */

.sun{
  position:absolute;

  width:78px;
  height:78px;

  border-radius:50%;

  right:9%;
  top:7%;

  background:#ffd681;

  box-shadow:
    0 0 35px #ffd681;

  z-index:3;
}


/* =====================================================
   CLOUDS
===================================================== */

.cloud{
  position:absolute;

  width:100px;
  height:28px;

  border-radius:30px;

  background:#f4d7ae;

  opacity:.65;

  z-index:4;

  animation:
    cloudMove
    26s linear infinite;
}

.cloud:before,
.cloud:after{

  content:"";

  position:absolute;

  background:#f4d7ae;

  border-radius:50%;
}

.cloud:before{

  width:45px;
  height:45px;

  left:14px;
  top:-22px;

}

.cloud:after{

  width:52px;
  height:52px;

  right:10px;
  top:-27px;

}

.cloud1{

  top:15%;
  left:8%;

}

.cloud2{

  top:24%;
  left:55%;

  animation-delay:-12s;

}

@keyframes cloudMove{

  from{
    transform:translateX(110vw);
  }

  to{
    transform:translateX(-250px);
  }

}


/* =====================================================
   GROUND
===================================================== */

#ground{

  position:absolute;

  left:0;
  bottom:0;

  width:100%;
  height:30%;

  background:
    repeating-linear-gradient(
      45deg,
      #986139 0px,
      #986139 18px,
      #85522f 18px,
      #85522f 36px
    );

  border-top:
    8px solid #603a25;

  z-index:8;

  animation:
    groundScroll
    .7s linear infinite;
}

@keyframes groundScroll{

  from{
    background-position:0 0;
  }

  to{
    background-position:-72px 0;
  }

}


/* =====================================================
   HUD
===================================================== */

#score{

  position:absolute;

  left:14px;
  top:12px;

  color:white;

  font-size:20px;
  font-weight:bold;

  text-shadow:
    2px 2px 4px #3d2415;

  z-index:40;

}

#best{

  position:absolute;

  right:14px;
  top:12px;

  color:white;

  font-size:17px;
  font-weight:bold;

  text-shadow:
    2px 2px 4px #3d2415;

  z-index:40;

}

#magnitude{

  position:absolute;

  left:14px;
  top:42px;

  color:white;

  font-size:14px;
  font-weight:bold;

  text-shadow:
    2px 2px 4px #3d2415;

  z-index:40;

}


/* =====================================================
   ROCKY
===================================================== */

/*
   IMPORTANT FIX

   The new R1-R4 frames have been aligned to the
   SAME bottom baseline.

   Therefore:
   player bottom = ground top.

   NO vertical bob animation is used.
*/

#player{

  position:absolute;

  left:7%;

  width:92px;
  height:92px;

  /*
     Ground is 30% of screen.
     Player bottom sits exactly on
     the top of the ground.
  */

  bottom:30%;

  z-index:15;

  /*
     Do NOT use translateY here.
     It creates a visible gap below Rocky.
  */

  transform-origin:center bottom;

  will-change:bottom;

}

#player img{

  width:100%;
  height:100%;

  object-fit:contain;

  display:block;

  user-select:none;

  -webkit-user-drag:none;

  /*
     IMPORTANT:
     No translateY.
     No margin-bottom.
     No padding-bottom.
  */

}


/*
   Running class intentionally does NOT move
   Rocky vertically.
*/

.running{

  animation:
    rockyRunRotate
    .22s
    ease-in-out
    infinite
    alternate;

}

@keyframes rockyRunRotate{

  from{
    transform:rotate(-1deg);
  }

  to{
    transform:rotate(1deg);
  }

}


/* =====================================================
   OBSTACLES
===================================================== */

.obstacle{

  position:absolute;

  bottom:30%;

  z-index:12;

  will-change:left;

}

.rock{

  width:50px;
  height:46px;

  background:#735039;

  border:
    5px solid #3d291c;

  border-radius:
    48% 52% 38% 55%;

  box-shadow:
    inset 10px 7px #997052,
    inset -8px -8px #503521;

}

.small{

  width:38px;
  height:35px;

}

.tall{

  width:45px;
  height:72px;

}


/* =====================================================
   FLYING ROCK
===================================================== */

.flying{

  /*
     Flying rock is intentionally low enough
     to be reachable by Rocky's jump.
  */

  transform:
    translateY(-105px);

  z-index:13;

}

.flying .rock{

  width:44px;
  height:44px;

  border-radius:50%;

  animation:
    flyingRock
    .32s
    ease-in-out
    infinite
    alternate;

}

.flying:after{

  content:"";

  position:absolute;

  width:35px;
  height:5px;

  left:-32px;
  top:20px;

  background:#d4ae85;

  opacity:.75;

}

@keyframes flyingRock{

  from{
    transform:
      translateY(-5px)
      rotate(-10deg);
  }

  to{
    transform:
      translateY(5px)
      rotate(10deg);
  }

}


/* =====================================================
   START / GAME OVER
===================================================== */

.overlay{

  position:absolute;

  inset:0;

  display:flex;

  flex-direction:column;

  justify-content:center;

  align-items:center;

  text-align:center;

  padding:20px;

  color:white;

  background:
    rgba(54,32,20,.78);

  z-index:60;

}

#gameOver,
#completed{

  display:none;

}

.title{

  font-size:42px;

  line-height:.95;

  font-weight:900;

  color:#f3c37f;

  text-shadow:
    4px 4px #4b2b19,
    7px 7px #25150d;

  margin-bottom:16px;

}

.subtitle{

  font-size:16px;

  line-height:1.5;

  margin-bottom:20px;

}

.result{

  font-size:18px;

  font-weight:bold;

  margin-bottom:20px;

}

button{

  border:
    4px solid #4b2b19;

  background:#b86b31;

  color:white;

  padding:
    12px 28px;

  border-radius:14px;

  font-size:19px;

  font-weight:bold;

  box-shadow:
    0 6px #4b2b19;

}

button:active{

  transform:
    translateY(5px);

  box-shadow:
    0 1px #4b2b19;

}


/* =====================================================
   HINT
===================================================== */

#hint{

  position:absolute;

  bottom:12px;

  width:100%;

  text-align:center;

  color:white;

  font-size:13px;

  font-weight:bold;

  text-shadow:
    2px 2px 3px #3d2415;

  z-index:20;

}


/* =====================================================
   MAGNITUDE 9
===================================================== */

.completeTitle{

  font-size:36px;

  line-height:1.05;

  color:#ffd17d;

  font-weight:900;

  text-shadow:
    4px 4px #4b2b19;

  margin-bottom:20px;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:500px){

  #player{

    width:82px;
    height:82px;

    left:7%;

    /*
       IMPORTANT:
       Same exact baseline.
    */

    bottom:30%;

  }

  #score{

    font-size:17px;

  }

  #best{

    font-size:15px;

  }

  #magnitude{

    font-size:13px;

  }

  .title{

    font-size:35px;

  }

}


/* =====================================================
   VERY SMALL PHONE
===================================================== */

@media(max-height:650px){

  #player{

    width:78px;
    height:78px;

  }

}


/* =====================================================
   WIDE SCREEN
===================================================== */

@media(min-width:900px){

  #player{

    width:105px;
    height:105px;

  }

}

</style>
</head>


<body>

<div id="game">


  <!-- =================================================
       BACKGROUND
  ================================================== -->

  <div class="sun"></div>

  <div class="cloud cloud1"></div>

  <div class="cloud cloud2"></div>

  <div class="mountainLayer"></div>

  <div class="mountainLayer2"></div>


  <!-- =================================================
       HUD
  ================================================== -->

  <div id="score">
    SCORE: 0
  </div>

  <div id="best">
    BEST: 0
  </div>

  <div id="magnitude">
    MAGNITUDE 1 • DESERT
  </div>


  <!-- =================================================
       ROCKY
  ================================================== -->

  <div
    id="player"
    class="running"
  >

    <img
      id="rockySprite"
      src="R1.png"
      alt="Rocky"
      draggable="false"
    >

  </div>


  <!-- =================================================
       GROUND
  ================================================== -->

  <div id="ground"></div>


  <!-- =================================================
       HINT
  ================================================== -->

  <div id="hint">
    TAP / CLICK / SPACE TO JUMP
  </div>


  <!-- =================================================
       START SCREEN
  ================================================== -->

  <div
    id="startScreen"
    class="overlay"
  >

    <div class="title">

      RUN<br>
      ROCKY<br>
      RUN

    </div>


    <div class="subtitle">

      Reach MAGNITUDE 9.<br><br>

      Flying rocks appear from<br>
      MAGNITUDE 3.

    </div>


    <button onclick="startGame()">
      PLAY
    </button>

  </div>


  <!-- =================================================
       GAME OVER
  ================================================== -->

  <div
    id="gameOver"
    class="overlay"
  >

    <div class="title">

      GAME<br>
      OVER

    </div>


    <div
      id="finalScore"
      class="result"
    >

      SCORE: 0

    </div>


    <button onclick="startGame()">

      RUN AGAIN

    </button>

  </div>


  <!-- =================================================
       COMPLETED
  ================================================== -->

  <div
    id="completed"
    class="overlay"
  >

    <div class="completeTitle">

      🎉 MAGNITUDE 9<br>
      COMPLETED!

    </div>


    <div
      id="completeScore"
      class="result"
    >

      FINAL SCORE: 135

    </div>


    <button onclick="startGame()">

      PLAY AGAIN

    </button>

  </div>

</div>


<script>

/* =====================================================
   ELEMENTS
===================================================== */

const game =
document.getElementById("game");

const player =
document.getElementById("player");

const rockySprite =
document.getElementById("rockySprite");

const scoreText =
document.getElementById("score");

const bestText =
document.getElementById("best");

const magnitudeText =
document.getElementById("magnitude");

const startScreen =
document.getElementById("startScreen");

const gameOverScreen =
document.getElementById("gameOver");

const completedScreen =
document.getElementById("completed");

const finalScore =
document.getElementById("finalScore");

const completeScore =
document.getElementById("completeScore");


/* =====================================================
   GAME VARIABLES
===================================================== */

let running = false;

let jumping = false;

let score = 0;

let magnitude = 1;

let speed = 6;

let obstacles = [];

let obstacleTimer = null;

let gameLoopId = null;

let spriteTimer = null;

let jumpStart = 0;

let jumpFrame = null;


/*
   SINGLE SOURCE OF TRUTH FOR GROUND POSITION.

   Everything uses this same value.
*/

const GROUND_BOTTOM =
  "30%";


/* =====================================================
   PERSONAL HIGH SCORE
===================================================== */

let best =
Number(
  localStorage.getItem(
    "runRockyBest"
  ) || 0
);

bestText.textContent =
"BEST: " + best;


/* =====================================================
   MAGNITUDE SETTINGS
===================================================== */

const levels = {

  1:{
    name:"DESERT",
    speed:6,
    spawn:1500
  },

  2:{
    name:"ROCKY VALLEY",
    speed:6.5,
    spawn:1400
  },

  3:{
    name:"CANYON",
    speed:7,
    spawn:1320
  },

  4:{
    name:"HIGH CANYON",
    speed:7.5,
    spawn:1250
  },

  5:{
    name:"LAVA ROCK",
    speed:8,
    spawn:1180
  },

  6:{
    name:"FIRE VALLEY",
    speed:8.5,
    spawn:1100
  },

  7:{
    name:"DARK RIDGE",
    speed:9,
    spawn:1030
  },

  8:{
    name:"STORM MOUNTAIN",
    speed:9.5,
    spawn:960
  },

  9:{
    name:"ROCKY FINAL",
    speed:10,
    spawn:900
  }

};


/* =====================================================
   UPDATE MAGNITUDE
===================================================== */

function updateMagnitude(){

  if(score <= 15){

    magnitude = 1;

  }else if(score <= 30){

    magnitude = 2;

  }else if(score <= 45){

    magnitude = 3;

  }else if(score <= 60){

    magnitude = 4;

  }else if(score <= 75){

    magnitude = 5;

  }else if(score <= 90){

    magnitude = 6;

  }else if(score <= 105){

    magnitude = 7;

  }else if(score <= 120){

    magnitude = 8;

  }else{

    magnitude = 9;

  }


  speed =
    levels[magnitude].speed;


  magnitudeText.textContent =
    "MAGNITUDE " +
    magnitude +
    " • " +
    levels[magnitude].name;

}


/* =====================================================
   RESET ROCKY TO GROUND
===================================================== */

function resetRockyToGround(){

  player.style.bottom =
    GROUND_BOTTOM;

}


/* =====================================================
   START GAME
===================================================== */

function startGame(){

  startScreen.style.display =
    "none";

  gameOverScreen.style.display =
    "none";

  completedScreen.style.display =
    "none";


  clearAllObstacles();


  clearTimeout(
    obstacleTimer
  );


  cancelAnimationFrame(
    gameLoopId
  );


  cancelAnimationFrame(
    jumpFrame
  );


  clearInterval(
    spriteTimer
  );


  score = 0;

  magnitude = 1;

  speed = 6;

  running = true;

  jumping = false;


  scoreText.textContent =
    "SCORE: 0";


  updateMagnitude();


  /*
     IMPORTANT:
     Force Rocky exactly onto ground.
  */

  resetRockyToGround();


  player.className =
    "running";


  rockySprite.src =
    "R1.png";


  startRunningAnimation();


  spawnLoop();


  gameLoopId =
    requestAnimationFrame(
      updateGame
    );

}


/* =====================================================
   RUNNING ANIMATION
===================================================== */

function startRunningAnimation(){

  clearInterval(
    spriteTimer
  );


  let frame = 1;


  spriteTimer =
    setInterval(
      function(){

        if(
          running &&
          !jumping
        ){

          frame++;

          if(frame > 4){

            frame = 1;

          }


          rockySprite.src =
            "R" +
            frame +
            ".png";

        }

      },
      110
    );

}


/* =====================================================
   SPAWN LOOP
===================================================== */

function spawnLoop(){

  if(!running){

    return;

  }


  spawnObstacle();


  const base =
    levels[magnitude].spawn;


  const random =
    Math.random() *
    300 -
    150;


  obstacleTimer =
    setTimeout(
      spawnLoop,
      Math.max(
        600,
        base + random
      )
    );

}


/* =====================================================
   CREATE OBSTACLE
===================================================== */

function spawnObstacle(){

  const obstacle =
    document.createElement(
      "div"
    );


  let isFlying = false;


  /*
     Flying rocks start at M3.
  */

  if(magnitude >= 3){

    let chance =
      0.18 +
      (
        magnitude - 3
      ) *
      0.04;


    isFlying =
      Math.random() < chance;

  }


  if(isFlying){

    obstacle.className =
      "obstacle flying";

  }else{

    obstacle.className =
      "obstacle";

  }


  const rock =
    document.createElement(
      "div"
    );


  if(isFlying){

    rock.className =
      "rock";

  }else{

    const random =
      Math.random();


    if(magnitude <= 2){

      rock.className =
        random < .5
        ? "rock small"
        : "rock";

    }else{

      rock.className =
        random < .35
        ? "rock"
        : "rock tall";

    }

  }


  obstacle.appendChild(
    rock
  );


  const startX =
    game.clientWidth +
    70;


  obstacle.style.left =
    startX + "px";


  game.appendChild(
    obstacle
  );


  obstacles.push({

    element:obstacle,

    x:startX,

    passed:false

  });

}


/* =====================================================
   JUMP
===================================================== */

function jump(){

  if(
    !running ||
    jumping
  ){

    return;

  }


  jumping = true;


  /*
     Stop running rotation during jump.
  */

  player.className = "";


  /*
     Good jump height.

     180px maximum.
     36% screen height limit.
  */

  const jumpHeight =
    Math.min(
      180,
      game.clientHeight * .36
    );


  jumpStart =
    performance.now();


  /*
     720ms total jump.
  */

  const jumpDuration =
    720;


  function jumpAnimation(time){

    if(!running){

      return;

    }


    const elapsed =
      time - jumpStart;


    const progress =
      elapsed /
      jumpDuration;


    if(progress >= 1){

      /*
         LAND EXACTLY ON THE SAME
         GROUND BASELINE.
      */

      resetRockyToGround();


      jumping = false;


      player.className =
        "running";


      jumpFrame = null;


      return;

    }


    /*
       Smooth jump arc.
    */

    const arc =
      Math.sin(
        progress *
        Math.PI
      );


    const currentHeight =
      arc *
      jumpHeight;


    /*
       Base = exact ground position.
    */

    player.style.bottom =
      "calc(30% + " +
      currentHeight +
      "px)";


    jumpFrame =
      requestAnimationFrame(
        jumpAnimation
      );

  }


  jumpFrame =
    requestAnimationFrame(
      jumpAnimation
    );

}


/* =====================================================
   COLLISION
===================================================== */

function collision(
  playerElement,
  obstacleElement
){

  const p =
    playerElement
    .getBoundingClientRect();


  const o =
    obstacleElement
    .getBoundingClientRect();


  /*
     Fair collision box.

     Rocky's transparent edges are ignored.
  */

  const paddingX =
    Math.min(
      12,
      p.width * .12
    );


  const paddingY =
    Math.min(
      8,
      p.height * .09
    );


  return !(
    p.right - paddingX <
      o.left ||

    p.left + paddingX >
      o.right ||

    p.bottom - paddingY <
      o.top ||

    p.top + paddingY >
      o.bottom
  );

}


/* =====================================================
   GAME LOOP
===================================================== */

function updateGame(){

  if(!running){

    return;

  }


  for(
    let i =
    obstacles.length - 1;

    i >= 0;

    i--
  ){

    const obstacle =
      obstacles[i];


    obstacle.x -=
      speed;


    obstacle.element.style.left =
      obstacle.x + "px";


    /*
       Score when obstacle passes Rocky.
    */

    if(
      !obstacle.passed &&
      obstacle.x <
      player.offsetLeft - 25
    ){

      obstacle.passed =
        true;


      score++;


      scoreText.textContent =
        "SCORE: " +
        score;


      const oldMagnitude =
        magnitude;


      updateMagnitude();


      if(
        magnitude >
        oldMagnitude
      ){

        levelUpSound();

      }

    }


    /*
       Remove old obstacle.
    */

    if(
      obstacle.x <
      -150
    ){

      obstacle.element.remove();


      obstacles.splice(
        i,
        1
      );


      continue;

    }


    /*
       Collision.
    */

    if(
      collision(
        player,
        obstacle.element
      )
    ){

      gameOver();

      return;

    }

  }


  /*
     Magnitude 9 completion.
  */

  if(score >= 135){

    completeGame();

    return;

  }


  gameLoopId =
    requestAnimationFrame(
      updateGame
    );

}


/* =====================================================
   GAME OVER
===================================================== */

function gameOver(){

  running = false;


  clearInterval(
    spriteTimer
  );


  clearTimeout(
    obstacleTimer
  );


  cancelAnimationFrame(
    jumpFrame
  );


  cancelAnimationFrame(
    gameLoopId
  );


  /*
     Keep Rocky on ground when game ends.
  */

  if(!jumping){

    resetRockyToGround();

  }


  if(score > best){

    best = score;


    localStorage.setItem(
      "runRockyBest",
      best
    );

  }


  bestText.textContent =
    "BEST: " +
    best;


  finalScore.textContent =
    "SCORE: " +
    score +
    " • MAGNITUDE " +
    magnitude;


  gameOverScreen.style.display =
    "flex";


  gameOverSound();

}


/* =====================================================
   COMPLETED
===================================================== */

function completeGame(){

  running = false;


  clearInterval(
    spriteTimer
  );


  clearTimeout(
    obstacleTimer
  );


  cancelAnimationFrame(
    jumpFrame
  );


  cancelAnimationFrame(
    gameLoopId
  );


  if(score > best){

    best = score;


    localStorage.setItem(
      "runRockyBest",
      best
    );

  }


  bestText.textContent =
    "BEST: " +
    best;


  completeScore.textContent =
    "FINAL SCORE: " +
    score;


  completedScreen.style.display =
    "flex";


  completeSound();

}


/* =====================================================
   CLEAR OBSTACLES
===================================================== */

function clearAllObstacles(){

  obstacles.forEach(
    function(obstacle){

      obstacle.element.remove();

    }
  );


  obstacles = [];

}


/* =====================================================
   SOUND SYSTEM
===================================================== */

let audioContext = null;


function initAudio(){

  if(!audioContext){

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

  }


  if(
    audioContext.state ===
    "suspended"
  ){

    audioContext.resume();

  }

}


function tone(
  frequency,
  duration,
  type="square",
  volume=.05
){

  initAudio();


  const oscillator =
    audioContext.createOscillator();


  const gain =
    audioContext.createGain();


  oscillator.type =
    type;


  oscillator.frequency.value =
    frequency;


  gain.gain.setValueAtTime(
    volume,
    audioContext.currentTime
  );


  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioContext.currentTime +
    duration
  );


  oscillator.connect(
    gain
  );


  gain.connect(
    audioContext.destination
  );


  oscillator.start();


  oscillator.stop(
    audioContext.currentTime +
    duration
  );

}

}

/* =====================================================
   TOUCH CONTROLS
===================================================== */

document.addEventListener(
  "touchstart",
  function(event){

    if(
      running &&
      event.target.tagName !==
      "BUTTON"
    ){

      event.preventDefault();


      jump();


      jumpSound();

    }

  },
  {
    passive:false
  }
);


/* =====================================================
   MOUSE
===================================================== */

document.addEventListener(
  "mousedown",
  function(event){

    if(
      running &&
      event.target.tagName !==
      "BUTTON"
    ){

      jump();


      jumpSound();

    }

  }
);


/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(
  "keydown",
  function(event){

    if(
      event.code === "Space" ||
      event.code === "ArrowUp"
    ){

      event.preventDefault();


      if(running){

        jump();


        jumpSound();

      }

    }

  }
);


/* =====================================================
   PREVENT IMAGE DRAG
===================================================== */

rockySprite.addEventListener(
  "dragstart",
  function(event){

    event.preventDefault();

  }
);
