<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Run Rocky Run</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#c58b55;
  touch-action:manipulation;
}

#game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:linear-gradient(#e3b37c,#d9a66d 55%,#c58b55);
}

/* Moving background */
#game:before{
  content:"";
  position:absolute;
  left:0;
  bottom:30%;
  width:260%;
  height:36%;
  background:
    linear-gradient(
      135deg,
      transparent 35%,
      #a86f42 35%,
      #a86f42 50%,
      transparent 50%
    );
  background-size:260px 180px;
  opacity:.4;
  animation:mountains 14s linear infinite;
  z-index:1;
}

#game:after{
  content:"";
  position:absolute;
  left:0;
  bottom:30%;
  width:300%;
  height:16%;
  background:
    radial-gradient(
      ellipse,
      #8c5833 0 45%,
      transparent 48%
    );
  background-size:180px 70px;
  opacity:.5;
  animation:groundMove 5s linear infinite;
  z-index:2;
}

@keyframes mountains{
  to{transform:translateX(-520px);}
}

@keyframes groundMove{
  to{transform:translateX(-540px);}
}

/* Sun */

.sun{
  position:absolute;
  width:90px;
  height:90px;
  border-radius:50%;
  background:#ffd27d;
  top:8%;
  right:12%;
  box-shadow:0 0 40px #ffd27d;
  z-index:2;
}

/* Clouds */

.cloud{
  position:absolute;
  width:100px;
  height:30px;
  border-radius:30px;
  background:#f4d3a2;
  opacity:.7;
  z-index:3;
  animation:cloudMove 25s linear infinite;
}

.cloud:before,
.cloud:after{
  content:"";
  position:absolute;
  background:#f4d3a2;
  border-radius:50%;
}

.cloud:before{
  width:45px;
  height:45px;
  left:15px;
  top:-22px;
}

.cloud:after{
  width:55px;
  height:55px;
  right:8px;
  top:-28px;
}

.cloud1{
  top:15%;
  left:10%;
}

.cloud2{
  top:27%;
  right:25%;
}

@keyframes cloudMove{
  from{transform:translateX(100vw);}
  to{transform:translateX(-250px);}
}

/* Ground */

#ground{
  position:absolute;
  bottom:0;
  width:100%;
  height:30%;
  background:
    repeating-linear-gradient(
      45deg,
      #9b633a 0 18px,
      #8c5833 18px 36px
    );
  border-top:8px solid #6d4328;
  z-index:6;
}

/* HUD */

#score,
#best,
#magnitude{
  position:absolute;
  z-index:30;
  color:white;
  font-weight:bold;
  text-shadow:2px 2px 4px #4b2d1a;
}

#score{
  top:18px;
  left:18px;
  font-size:22px;
}

#best{
  top:18px;
  right:18px;
  font-size:18px;
}

#magnitude{
  top:52px;
  left:18px;
  font-size:16px;
}

/* Rocky */

#player{
  position:absolute;
  width:76px;
  height:92px;
  left:60px;
  bottom:30%;
  z-index:10;
  transform-origin:center bottom;
}

#player img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
  user-select:none;
  -webkit-user-drag:none;
}

/* Running animation */

.running{
  animation:rockyRun .25s ease-in-out infinite alternate;
}

@keyframes rockyRun{
  from{
    transform:translateY(0) rotate(-2deg);
  }
  to{
    transform:translateY(-4px) rotate(2deg);
  }
}

/* Jump */

.jumping{
  animation:none !important;
}

.jumping img{
  transform:rotate(-6deg) scale(1.04);
}

/* Obstacles */

.obstacle{
  position:absolute;
  bottom:30%;
  z-index:8;
}

.rock{
  width:50px;
  height:48px;
  background:#765039;
  border:5px solid #3d2a1d;
  border-radius:45% 55% 35% 50%;
  box-shadow:
    inset 10px 8px #987052,
    inset -8px -8px #543723;
}

.small{
  width:38px;
  height:35px;
}

.tall{
  width:45px;
  height:75px;
}

/* Flying obstacles */

.flying{
  bottom:auto;
  top:40%;
  z-index:9;
}

.flying .rock{
  width:44px;
  height:44px;
  border-radius:50%;
  animation:flyingRock .35s ease-in-out infinite alternate;
}

.flying:after{
  content:"";
  position:absolute;
  left:-34px;
  top:20px;
  width:35px;
  height:5px;
  background:#d8b18a;
  opacity:.7;
}

@keyframes flyingRock{
  from{
    transform:translateY(-5px) rotate(-10deg);
  }
  to{
    transform:translateY(5px) rotate(10deg);
  }
}

/* Hint */

#hint{
  position:absolute;
  bottom:18px;
  width:100%;
  text-align:center;
  z-index:25;
  color:white;
  font-size:15px;
  font-weight:bold;
  text-shadow:2px 2px 3px #4b2d1a;
}

/* Screens */

.overlay{
  position:absolute;
  inset:0;
  z-index:50;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  color:white;
  background:rgba(55,32,20,.72);
  padding:20px;
}

.title{
  font-size:45px;
  line-height:.95;
  font-weight:900;
  color:#f4c27b;
  text-shadow:
    4px 4px #4b2b19,
    7px 7px #24160e;
  margin-bottom:15px;
}

.subtitle,
.result{
  margin-bottom:20px;
  font-size:18px;
  line-height:1.5;
}

.result{
  font-weight:bold;
}

button{
  border:4px solid #4b2b19;
  background:#b96d32;
  color:white;
  padding:15px 38px;
  border-radius:15px;
  font-size:21px;
  font-weight:bold;
  box-shadow:0 6px #4b2b19;
}

button:active{
  transform:translateY(5px);
  box-shadow:0 1px #4b2b19;
}

#gameOver,
#completed{
  display:none;
}

@media(max-width:500px){

  #player{
    left:48px;
    width:72px;
    height:88px;
  }

  .title{
    font-size:39px;
  }

}
</style>
</head>

<body>

<div id="game">

  <div class="sun"></div>

  <div class="cloud cloud1"></div>
  <div class="cloud cloud2"></div>

  <!-- HUD -->

  <div id="score">SCORE: 0</div>

  <div id="best">BEST: 0</div>

  <div id="magnitude">
    MAGNITUDE 1 • DESERT
  </div>

  <!-- ROCKY -->

  <div id="player" class="running">

    <img
      id="rockySprite"
      src="R1.png"
      alt="Rocky"
    >

  </div>

  <!-- Ground -->

  <div id="ground"></div>

  <div id="hint">
    TAP ANYWHERE TO JUMP
  </div>


  <!-- START SCREEN -->

  <div id="startScreen" class="overlay">

    <div class="title">
      RUN<br>
      ROCKY<br>
      RUN
    </div>

    <div class="subtitle">
      Reach MAGNITUDE 9.<br>
      Flying rocks begin at MAGNITUDE 3.
    </div>

    <button onclick="startGame()">
      PLAY
    </button>

  </div>


  <!-- GAME OVER -->

  <div id="gameOver" class="overlay">

    <div class="title">
      GAME<br>
      OVER
    </div>

    <div id="finalScore" class="result">
      SCORE: 0
    </div>

    <button onclick="startGame()">
      RUN AGAIN
    </button>

  </div>


  <!-- COMPLETED -->

  <div id="completed" class="overlay">

    <div class="title">
      ALL<br>
      MAGNITUDES<br>
      COMPLETED!
    </div>

    <div id="completeScore" class="result">
      ROCKY MASTERED THE RUN!
    </div>

    <button onclick="startGame()">
      RUN AGAIN
    </button>

  </div>

</div>


<script>

/* ==========================
   GAME VARIABLES
========================== */

const game =
  document.getElementById("game");

const player =
  document.getElementById("player");

const rockySprite =
  document.getElementById("rockySprite");

const scoreText =
  document.getElementById("score");

const bestText =
  document.getElementById("best");

const magnitudeText =
  document.getElementById("magnitude");

const startScreen =
  document.getElementById("startScreen");

const gameOverScreen =
  document.getElementById("gameOver");

const completedScreen =
  document.getElementById("completed");

const finalScore =
  document.getElementById("finalScore");

const completeScore =
  document.getElementById("completeScore");


let running = false;

let jumping = false;

let score = 0;

let magnitude = 1;

let speed = 6;

let obstacles = [];

let animationFrame;

let obstacleTimer;

let spriteTimer;

let jumpAnimation;


/* ==========================
   BEST SCORE
========================== */

let best =
  Number(
    localStorage.getItem("rockyBest") || 0
  );

bestText.textContent =
  "BEST: " + best;


/* ==========================
   MAGNITUDE SETTINGS
========================== */

const magnitudes = {

  1:{
    name:"DESERT",
    speed:6,
    spawn:1550,
    color:"#e3b37c",
    flying:0
  },

  2:{
    name:"ROCKY VALLEY",
    speed:6.5,
    spawn:1450,
    color:"#c99563",
    flying:0
  },

  3:{
    name:"CANYON",
    speed:7,
    spawn:1350,
    color:"#b87545",
    flying:.20
  },

  4:{
    name:"HIGH CANYON",
    speed:7.5,
    spawn:1280,
    color:"#aa6842",
    flying:.25
  },

  5:{
    name:"LAVA ROCK",
    speed:8,
    spawn:1200,
    color:"#95513d",
    flying:.30
  },

  6:{
    name:"FIRE VALLEY",
    speed:8.5,
    spawn:1120,
    color:"#83473b",
    flying:.35
  },

  7:{
    name:"DARK RIDGE",
    speed:9,
    spawn:1050,
    color:"#704844",
    flying:.40
  },

  8:{
    name:"STORM MOUNTAIN",
    speed:9.5,
    spawn:980,
    color:"#5e4c4d",
    flying:.45
  },

  9:{
    name:"ROCKY FINAL",
    speed:10,
    spawn:900,
    color:"#4b4148",
    flying:.50
  }

};


/* ==========================
   SOUND
========================== */

let audioContext = null;


function initAudio(){

  if(!audioContext){

    audioContext =
      new(
        window.AudioContext ||
        window.webkitAudioContext
      )();

  }

  if(
    audioContext.state ===
    "suspended"
  ){

    audioContext.resume();

  }

}


function playTone(
  frequency,
  duration=.08,
  type="square",
  volume=.05
){

  if(!audioContext){
    return;
  }

  const oscillator =
    audioContext.createOscillator();

  const gain =
    audioContext.createGain();


  oscillator.type =
    type;

  oscillator.frequency.value =
    frequency;


  gain.gain.setValueAtTime(
    volume,
    audioContext.currentTime
  );


  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioContext.currentTime + duration
  );


  oscillator.connect(gain);

  gain.connect(
    audioContext.destination
  );


  oscillator.start();

  oscillator.stop(
    audioContext.currentTime +
    duration
  );

}


function sound(notes){

  initAudio();

  notes.forEach(
    (note,index)=>{

      setTimeout(
        ()=>{

          playTone(
            note[0],
            note[1],
            note[2] || "square",
            note[3] || .05
          );

        },
        index * 90
      );

    }
  );

}


/* ==========================
   SET MAGNITUDE
========================== */

function updateMagnitude(){

  if(score <= 15){

    magnitude = 1;

  }
  else if(score <= 30){

    magnitude = 2;

  }
  else if(score <= 45){

    magnitude = 3;

  }
  else if(score <= 60){

    magnitude = 4;

  }
  else if(score <= 75){

    magnitude = 5;

  }
  else if(score <= 90){

    magnitude = 6;

  }
  else if(score <= 105){

    magnitude = 7;

  }
  else if(score <= 120){

    magnitude = 8;

  }
  else{

    magnitude = 9;

  }


  const current =
    magnitudes[magnitude];


  speed =
    current.speed;


  magnitudeText.textContent =
    "MAGNITUDE " +
    magnitude +
    " • " +
    current.name;


  game.style.background =
    "linear-gradient(" +
    "to bottom," +
    current.color +
    " 0%," +
    current.color +
    " 55%," +
    "#8c5833 100%)";

}


/* ==========================
   START
========================== */

function startGame(){

  initAudio();

  sound([
    [440,.08],
    [660,.12]
  ]);


  startScreen.style.display =
    "none";

  gameOverScreen.style.display =
    "none";

  completedScreen.style.display =
    "none";


  clearObstacles();

  clearTimeout(
    obstacleTimer
  );

  cancelAnimationFrame(
    animationFrame
  );


  score = 0;

  magnitude = 1;

  speed = 6;

  running = true;

  jumping = false;


  player.className =
    "running";


  player.style.bottom =
    "30%";


  scoreText.textContent =
    "SCORE: 0";


  updateMagnitude();

  startRunningAnimation();

  obstacleLoop();


  animationFrame =
    requestAnimationFrame(
      updateGame
    );

}


/* ==========================
   RUNNING SPRITE ANIMATION
========================== */

function startRunningAnimation(){

  clearInterval(
    spriteTimer
  );


  let frame = 1;


  spriteTimer =
    setInterval(
      ()=>{

        if(
          running &&
          !jumping
        ){

          frame++;

          if(frame > 4){

            frame = 1;

          }


          rockySprite.src =
            "R" + frame + ".png";

        }

      },
      110
    );

}


/* ==========================
   OBSTACLE LOOP
========================== */

function obstacleLoop(){

  if(!running){

    return;

  }


  spawnObstacle();


  const current =
    magnitudes[magnitude];


  const randomDelay =
    Math.random() * 220 - 80;


  obstacleTimer =
    setTimeout(
      obstacleLoop,
      Math.max(
        650,
        current.spawn +
        randomDelay
      )
    );

}


/* ==========================
   CREATE OBSTACLE
========================== */

function spawnObstacle(){

  const obstacle =
    document.createElement("div");


  const current =
    magnitudes[magnitude];


  const isFlying =
    magnitude >= 3 &&
    Math.random() <
    current.flying;


  obstacle.className =
    isFlying
      ? "obstacle flying"
      : "obstacle";


  const rock =
    document.createElement("div");


  if(isFlying){

    rock.className =
      "rock";


    obstacle.style.top =
      (
        37 +
        Math.random() * 15
      ) + "%";

  }

  else{

    const random =
      Math.random();


    if(magnitude <= 2){

      rock.className =
        random < .55
          ? "rock small"
          : "rock";

    }

    else if(magnitude <= 4){

      rock.className =
        random < .45
          ? "rock"
          : "rock tall";

    }

    else{

      rock.className =
        random < .25
          ? "rock"
          : "rock tall";

    }

  }


  obstacle.appendChild(
    rock
  );


  obstacle.style.left =
    (
      window.innerWidth +
      70
    ) + "px";


  game.appendChild(
    obstacle
  );


  obstacles.push({

    element:obstacle,

    x:
      window.innerWidth +
      70,

    passed:false

  });

}


/* ==========================
   JUMP
========================== */

function jump(){

  if(
    !running ||
    jumping
  ){

    return;

  }


  initAudio();


  sound([
    [420,.08],
    [620,.10]
  ]);


  jumping = true;


  player.className =
    "jumping";


  const start =
    performance.now();


  const duration =
    650;


  const height =
    175;


  function jumpLoop(time){

    if(!running){

      return;

    }


    const progress =
      (
        time -
        start
      ) / duration;


    if(progress >= 1){

      player.style.bottom =
        "30%";


      jumping = false;


      player.className =
        "running";


      return;

    }


    const jumpHeight =
      Math.sin(
        progress *
        Math.PI
      ) * height;


    player.style.bottom =
      "calc(30% + " +
      jumpHeight +
      "px)";


    jumpAnimation =
      requestAnimationFrame(
        jumpLoop
      );

  }


  jumpAnimation =
    requestAnimationFrame(
      jumpLoop
    );

}


/* ==========================
   COLLISION
========================== */

function checkCollision(
  playerElement,
  obstacleElement
){

  const playerRect =
    playerElement.getBoundingClientRect();

  const obstacleRect =
    obstacleElement.getBoundingClientRect();


  const padding =
    10;


  return !(
    playerRect.right -
      padding <
      obstacleRect.left ||

    playerRect.left +
      padding >
      obstacleRect.right ||

    playerRect.bottom -
      padding <
      obstacleRect.top ||

    playerRect.top +
      padding >
      obstacleRect.bottom
  );

}


/* ==========================
   MAIN GAME LOOP
========================== */

function updateGame(){

  if(!running){

    return;

  }


  for(
    let i =
      obstacles.length - 1;

    i >= 0;

    i--
  ){

    const obstacle =
      obstacles[i];


    obstacle.x -=
      speed;


    obstacle.element.style.left =
      obstacle.x + "px";


    /* Score */

    if(
      !obstacle.passed &&
      obstacle.x <
        player.offsetLeft - 35
    ){

      obstacle.passed =
        true;


      score++;


      scoreText.textContent =
        "SCORE: " +
        score;


      sound([
        [700,.05,"sine"],
        [900,.07,"sine"]
      ]);


      const oldMagnitude =
        magnitude;


      updateMagnitude();


      if(
        magnitude >
        oldMagnitude
      ){

        sound([
          [520,.08],
          [700,.08],
          [900,.14]
        ]);

      }

    }


    /* Magnitude 9 completed */

    if(score >= 135){

      completeGame();

      return;

    }


    /* Remove obstacle */

    if(
      obstacle.x <
      -130
    ){

      obstacle.element.remove();

      obstacles.splice(
        i,
        1
      );

      continue;

    }


    /* Collision */

    if(
      checkCollision(
        player,
        obstacle.element
      )
    ){

      gameOver();

      return;

    }

  }


  animationFrame =
    requestAnimationFrame(
      updateGame
    );

}


/* ==========================
   GAME OVER
========================== */

function gameOver(){

  running = false;


  clearInterval(
    spriteTimer
  );


  cancelAnimationFrame(
    animationFrame
  );


  cancelAnimationFrame(
    jumpAnimation
  );


  clearTimeout(
    obstacleTimer
  );


  sound([
    [300,.15,"sawtooth",.06],
    [180,.25,"sawtooth",.05]
  ]);


  if(score > best){

    best = score;


    localStorage.setItem(
      "rockyBest",
      best
    );

  }


  bestText.textContent =
    "BEST: " +
    best;


  finalScore.textContent =
    "SCORE: " +
    score +
    " • MAGNITUDE " +
    magnitude;


  gameOverScreen.style.display =
    "flex";

}


/* ==========================
   COMPLETED
========================== */

function completeGame(){

  running = false;


  clearInterval(
    spriteTimer
  );


  cancelAnimationFrame(
    animationFrame
  );


  cancelAnimationFrame(
    jumpAnimation
  );


  clearTimeout(
    obstacleTimer
  );


  sound([
    [660,.16,"sine",.07],
    [780,.16,"sine",.07],
    [900,.16,"sine",.07],
    [1100,.20,"sine",.08]
  ]);


  if(score > best){

    best = score;


    localStorage.setItem(
      "rockyBest",
      best
    );

  }


  bestText.textContent =
    "BEST: " +
    best;


  completeScore.textContent =
    "MAGNITUDE 9 COMPLETED • SCORE: " +
    score;


  completedScreen.style.display =
    "flex";

}


/* ==========================
   CLEAR OBSTACLES
========================== */

function clearObstacles(){

  obstacles.forEach(
    obstacle => {

      obstacle.element.remove();

    }
  );


  obstacles = [];

}


/* ==========================
   MOBILE TOUCH
========================== */

document.addEventListener(
  "touchstart",
  function(event){

    if(
      running &&
      event.target.tagName !==
      "BUTTON"
    ){

      event.preventDefault();

      jump();

    }

  },
  {
    passive:false
  }
);


/* ==========================
   KEYBOARD
========================== */

document.addEventListener(
  "keydown",
  function(event){

    if(
      event.code === "Space" ||
      event.code === "ArrowUp"
    ){

      jump();

    }

  }
);

</script>

</body>
</html>
